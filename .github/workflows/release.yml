name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Check tag matches plugin.json and CHANGELOG
        run: node scripts/release-check.js "$GITHUB_REF_NAME"

      - name: Run test suite
        run: npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-check.js --notes > notes.md
          gh release create "$GITHUB_REF_NAME" --title "mynameisjev $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
