name: Drift check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Check vendor and tooling releases
        id: drift
        run: node scripts/drift-check.js --out drift.md

      - name: Open or update drift issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create drift --force --description "Model or tooling releases to review" --color D4A72C
          issue=$(gh issue list --label drift --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file drift.md
          else
            gh issue create --title "Model or tooling drift detected" --label drift --body-file drift.md
          fi
